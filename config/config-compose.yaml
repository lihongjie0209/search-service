app:
  env: compose
log:
  level: debug
  file: /app/logs/app.log
swagger:
  enabled: true
database:
  name: platform
  schema: search
grpc:
  reflection_enabled: true
opensearch:
  enabled: true
  addresses: [http://opensearch:9200]
outbound:
  grpc:
    authorization:
      target: authorization-service:9090
      timeout: 5s
      retry:
        enabled: true
        max_attempts: 3
        initial_backoff: 100ms
        max_backoff: 1s
        backoff_multiplier: 2
      circuit_breaker:
        enabled: true
        failure_threshold: 5
        open_timeout: 30s
      tls:
        enabled: false
